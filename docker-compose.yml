version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-portfolio-tracker
    ports:
      - "8501:8501"         # Streamlit default port
    env_file:
      - .env                # Load secrets / API keys from .env file
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
    volumes:
      # Mount source code for hot-reload during development.
      # Remove this volume block for a pure production deploy.
      - .:/app
      # Keep the venv inside the container (don't overwrite it with the host venv)
      - /app/venv
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
